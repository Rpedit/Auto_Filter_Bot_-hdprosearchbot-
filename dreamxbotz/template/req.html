<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HD PRO SEARCH BOT | Request Movie & Series</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,500;0,700;0,800;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: radial-gradient(circle at 15% 15%, #2b0507 0%, #120305 45%, #080204 95%);
            color: #f8fafc;
            font-family: 'Josefin Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .brand-gradient-text {
            background: linear-gradient(135deg, #FF1E27 0%, #FF5722 50%, #FFB800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            transition: all 0.25s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: #FF5722;
            box-shadow: 0 0 15px rgba(255, 87, 34, 0.35);
        }

        .submit-btn {
            background: linear-gradient(135deg, #FF1E27 0%, #FF5722 50%, #FFB800 100%);
            color: white;
            font-weight: 800;
            transition: all 0.25s ease;
            box-shadow: 0 6px 25px rgba(255, 30, 39, 0.4);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body class="p-4 flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="glass-card mx-auto w-full max-w-2xl px-5 py-3.5 mb-8 flex justify-center items-center">
        <a href="https://t.me/+sIOgiCYLtBxhNGI1" class="flex items-center gap-2">
            <h1 class="text-xl sm:text-2xl font-extrabold brand-gradient-text uppercase tracking-wide">
                HD PRO REQUEST PORTAL <span style="-webkit-text-fill-color: initial;">🎬</span>
            </h1>
        </a>
    </nav>

    <!-- Request Form Card -->
    <main class="w-full max-w-2xl mx-auto glass-card p-6 sm:p-10 mb-8">
        <div class="text-center mb-6">
            <h2 class="text-2xl sm:text-3xl font-black uppercase tracking-wide mb-2 brand-gradient-text">
                Movie / Series Request
            </h2>
            <p class="text-xs sm:text-sm text-slate-300">
                Aapko jo bhi movie ya web-series chahiye uska accurate naam aur details bharein.
            </p>
        </div>

        <form id="requestForm" onsubmit="handleRequest(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
                    Movie / Series Title <span class="text-[#FF1E27]">*</span>
                </label>
                <input type="text" id="movieTitle" required placeholder="e.g. Inception, Stranger Things"
                    class="w-full px-4 py-3 rounded-xl text-sm glass-input placeholder-slate-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Release Year</label>
                    <input type="number" id="releaseYear" min="1950" max="2027" placeholder="e.g. 2024"
                        class="w-full px-4 py-3 rounded-xl text-sm glass-input placeholder-slate-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Preferred Audio</label>
                    <select id="audioLang" class="w-full px-4 py-3 rounded-xl text-sm glass-input bg-[#120305] text-slate-200">
                        <option value="Hindi Dual Audio">Hindi (Dual Audio)</option>
                        <option value="Hindi Dubbed">Hindi Dubbed</option>
                        <option value="English">English / Original</option>
                        <option value="Multi Audio">Multi Audio</option>
                        <option value="South Indian Dubbed">South Dubbed</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Preferred Quality</label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="flex items-center gap-2 text-xs bg-white/5 p-3 rounded-xl border border-white/10 cursor-pointer hover:bg-white/10">
                        <input type="radio" name="quality" value="480p" class="accent-[#FF1E27]"> 480p
                    </label>
                    <label class="flex items-center gap-2 text-xs bg-white/5 p-3 rounded-xl border border-white/10 cursor-pointer hover:bg-white/10">
                        <input type="radio" name="quality" value="720p" checked class="accent-[#FF1E27]"> 720p HD
                    </label>
                    <label class="flex items-center gap-2 text-xs bg-white/5 p-3 rounded-xl border border-white/10 cursor-pointer hover:bg-white/10">
                        <input type="radio" name="quality" value="1080p" class="accent-[#FF1E27]"> 1080p FHD
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn w-full py-4 rounded-xl text-sm uppercase tracking-wider flex items-center justify-center gap-2 mt-6">
                <i class="fa-solid fa-paper-plane"></i> Submit Request via Telegram
            </button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 pb-4">
        Made for <a href="https://t.me/+sIOgiCYLtBxhNGI1" class="brand-gradient-text font-bold">HD PRO SEARCH BOT</a>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="glass-card px-5 py-3 text-xs font-bold text-slate-100 border border-[#FF5722]/50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-[#FFB800] text-base"></i>
        <span id="toastMsg">Submitted!</span>
    </div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById("toast");
            document.getElementById("toastMsg").innerText = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2800);
        }

        function handleRequest(e) {
            e.preventDefault();
            const title = document.getElementById("movieTitle").value.trim();
            const year = document.getElementById("releaseYear").value.trim() || "Any";
            const lang = document.getElementById("audioLang").value;
            const qual = document.querySelector('input[name="quality"]:checked').value;

            const telegramMsg = encodeURIComponent(
                `🎬 *NEW MOVIE REQUEST*\n\n` +
                `📌 *Title:* ${title}\n` +
                `📅 *Year:* ${year}\n` +
                `🗣 *Audio:* ${lang}\n` +
                `📺 *Quality:* ${qual}\n\n` +
                `Submitted via Request Portal.`
            );

            showToast("Redirecting to Telegram...");
            
            // Channel/Bot redirect link
            setTimeout(() => {
                window.location.href = `https://t.me/+sIOgiCYLtBxhNGI1?text=${telegramMsg}`;
            }, 600);
        }
    </script>
</body>
</html>
