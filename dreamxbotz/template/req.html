<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HD PRO SEARCH BOT</title>

<meta name="theme-color" content="#080808">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<script src="https://cdn.tailwindcss.com"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    color:#fff;
    font-family:"Josefin Sans",sans-serif;

    background:
    radial-gradient(circle at top,rgba(150,0,0,.25),transparent 38%),
    linear-gradient(180deg,#070707,#0c0c0c);
}

.glass{
    background:rgba(20,20,20,.78);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 15px 45px rgba(0,0,0,.4);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.logo{
    background:linear-gradient(90deg,#ff2020,#ff7a00,#ffd000);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(5,5,5,.9);
    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(15px);
}

.search-box{
    width:100%;
    background:#111;
    border:1px solid rgba(255,255,255,.1);
    outline:none;
    color:white;
    transition:.2s;
}

.search-box:focus{
    border-color:#ef2020;
    box-shadow:0 0 0 3px rgba(239,32,32,.1);
}

.search-btn{
    background:linear-gradient(90deg,#e50914,#ff3b00);
    transition:.2s;
}

.search-btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.1);
}

.ad-label{
    color:#666;
    font-size:9px;
    letter-spacing:1.5px;
    text-align:center;
    margin-bottom:5px;
}

.ad-slot{
    width:100%;
    overflow:hidden;
    border-radius:10px;
}

.result-card{
    transition:.2s;
}

.result-card:hover{
    transform:translateY(-2px);
    border-color:rgba(255,50,50,.3);
}

footer{
    border-top:1px solid rgba(255,255,255,.07);
}

</style>
</head>

<body>

<header class="header">

<div class="max-w-6xl mx-auto px-4 py-4
flex items-center justify-between gap-4">

<div>

<div class="logo font-bold text-xl sm:text-2xl">
HD PRO SEARCH BOT
</div>

<div class="text-xs text-gray-500 mt-1">
Search • Stream • Download
</div>

</div>

<a
href="https://t.me/+sIOgiCYLtBxhNGI1"
target="_blank"
rel="noopener noreferrer"
class="bg-red-600 hover:bg-red-700 px-4 py-2
rounded-lg text-sm font-semibold">

<i class="fa-brands fa-telegram mr-1"></i>
Telegram

</a>

</div>

</header>


<main class="max-w-4xl mx-auto px-4 py-8">

<!-- TOP AD -->

<div class="mb-6">

<div class="ad-label">
ADVERTISEMENT
</div>

<div id="ad-slot-top" class="ad-slot">

<!--
PASTE YOUR REAL AD NETWORK CODE HERE
-->

</div>

</div>


<!-- SEARCH -->

<section class="glass rounded-2xl p-5 sm:p-7">

<div class="text-center mb-6">

<div class="w-16 h-16 mx-auto rounded-2xl
bg-red-600/10 flex items-center justify-center">

<i class="fa-solid fa-magnifying-glass
text-red-500 text-2xl"></i>

</div>

<h1 class="text-2xl sm:text-3xl font-bold mt-4">
Search Movies
</h1>

<p class="text-gray-500 text-sm mt-2">
Enter movie or series name to search
</p>

</div>


<form id="searchForm">

<div class="flex flex-col sm:flex-row gap-3">

<input
id="searchInput"
class="search-box rounded-xl px-5 py-4"
type="search"
autocomplete="off"
placeholder="Search movie name..."
required
>

<button
type="submit"
class="search-btn rounded-xl px-7 py-4
font-bold">

<i class="fa-solid fa-search mr-2"></i>
Search

</button>

</div>

</form>

</section>


<!-- RESULTS -->

<section id="resultsSection" class="mt-6 hidden">

<div class="flex items-center justify-between mb-3">

<h2 class="font-bold text-lg">
Search Results
</h2>

<span id="resultCount"
class="text-xs text-gray-500">
</span>

</div>

<div id="results"
class="space-y-3">
</div>

</section>


<!-- MESSAGE -->

<div
id="message"
class="hidden glass rounded-xl p-5 text-center mt-6">

<i id="messageIcon"
class="fa-solid fa-info-circle
text-red-500 text-2xl"></i>

<div id="messageText"
class="text-gray-400 mt-2 text-sm">
</div>

</div>


<!-- BOTTOM AD -->

<div class="mt-8">

<div class="ad-label">
ADVERTISEMENT
</div>

<div id="ad-slot-bottom" class="ad-slot">

<!-- OPTIONAL SECOND AD -->

</div>

</div>

</main>


<footer class="mt-10 py-6 text-center text-gray-600 text-sm">

<div>
HD PRO SEARCH BOT
</div>

<div class="mt-1">
Made by <span class="text-gray-400">RPEDITZ</span>
</div>

</footer>


<script>

/*
=========================================================
SEARCH CONFIG
=========================================================

IMPORTANT:

Agar tumhare Telegram bot/backend me already search API hai,
sirf SEARCH_API ko apne existing endpoint se replace karo.

Example:

const SEARCH_API = "/search?q=";

Ya:

const SEARCH_API = "/api/search?q=";

=========================================================
*/

const SEARCH_API = "/search?q=";


/* ELEMENTS */

const searchForm =
document.getElementById("searchForm");

const searchInput =
document.getElementById("searchInput");

const resultsSection =
document.getElementById("resultsSection");

const results =
document.getElementById("results");

const resultCount =
document.getElementById("resultCount");

const message =
document.getElementById("message");

const messageText =
document.getElementById("messageText");


/* MESSAGE */

function showMessage(text){

    message.classList.remove("hidden");

    messageText.textContent=text;

}

function hideMessage(){

    message.classList.add("hidden");

}


/* SEARCH */

searchForm.addEventListener("submit",async function(e){

    e.preventDefault();

    const query =
    searchInput.value.trim();

    if(!query){

        showMessage("Please enter a movie name.");

        return;
    }

    results.innerHTML="";

    resultsSection.classList.add("hidden");

    showMessage("Searching...");

    try{

        const response =
        await fetch(
            SEARCH_API+
            encodeURIComponent(query),
            {
                method:"GET",
                headers:{
                    "Accept":"application/json"
                },
                cache:"no-store"
            }
        );

        if(!response.ok){

            throw new Error(
                "Search request failed"
            );

        }

        const data =
        await response.json();

        hideMessage();

        renderResults(data);

    }
    catch(error){

        console.error(error);

        showMessage(
            "Search service is currently unavailable."
        );

    }

});


/* RESULTS */

function renderResults(data){

    let items=[];

    /*
    Supports:

    [
        {...},
        {...}
    ]

    OR

    {
        results:[...]
    }
    */

    if(Array.isArray(data)){

        items=data;

    }
    else if(
        data &&
        Array.isArray(data.results)
    ){

        items=data.results;

    }


    if(!items.length){

        showMessage(
            "No results found."
        );

        return;
    }


    results.innerHTML="";

    resultCount.textContent=
    items.length+" results";


    items.forEach((item,index)=>{

        const name =
        item.name ||
        item.title ||
        item.file_name ||
        "Movie";


        const url =
        item.url ||
        item.link ||
        item.file_url ||
        "#";


        const card =
        document.createElement("a");


        card.href=url;

        card.className=
        "result-card glass rounded-xl p-4 flex gap-4 items-center";


        card.innerHTML=`

        <div class="
        w-12 h-12 shrink-0 rounded-xl
        bg-red-600/10
        flex items-center justify-center">

            <i class="
            fa-solid fa-film
            text-red-500 text-xl"></i>

        </div>

        <div class="min-w-0 flex-1">

            <div class="
            font-semibold
            break-words">

                ${escapeHTML(name)}

            </div>

            <div class="
            text-xs text-gray-500 mt-1">

                Click to watch

            </div>

        </div>

        <i class="
        fa-solid fa-chevron-right
        text-gray-600"></i>

        `;


        results.appendChild(card);

    });


    resultsSection.classList.remove("hidden");

}


/* SAFE HTML */

function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
